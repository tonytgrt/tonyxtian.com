<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- scripts/prerender.ts fills in the title, description, canonical
         address and share card for each route from src/content. -->
    <title>Tony Yiding Tian · Graphics Engineer</title>
    <meta name="description" content="Tony Yiding Tian's portfolio: GPU programming, real-time rendering and graphics systems." />
    <link rel="canonical" href="https://tonyxtian.com/" />
    <meta name="theme-color" content="#020a12" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tony Yiding Tian" />
    <meta property="og:title" content="Tony Yiding Tian · Graphics Engineer" />
    <meta property="og:description" content="Tony Yiding Tian's portfolio: GPU programming, real-time rendering and graphics systems." />
    <meta property="og:url" content="https://tonyxtian.com/" />
    <meta property="og:image" content="" />
    <meta property="og:image:alt" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      document.documentElement.classList.add('js');
      try {
        if (localStorage.getItem('tonyxtian.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
