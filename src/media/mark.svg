<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site's mark: a T that is also the night sea it ends on. The horizon
       is its bar, the moon's path of light on the water its stem, broken by
       the ripples, and the moon hangs off to the right above them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07142a"/>
      <stop offset="0.36" stop-color="#16365c"/>
      <stop offset="0.37" stop-color="#0a2140"/>
      <stop offset="1" stop-color="#030b16"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#f3ead6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#f3ead6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3ead6" stop-opacity="0"/>
    </radialGradient>
    <mask id="ripples">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="20" y="34.4" width="24" height="1.4"/>
      <rect x="20" y="41.6" width="24" height="1.6"/>
      <rect x="20" y="49" width="24" height="1.8"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <line x1="5" y1="23" x2="59" y2="23" stroke="#6f9fd0" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="48" cy="11" r="8" fill="url(#halo)"/>
  <circle cx="48" cy="11" r="3.6" fill="#f3ead6"/>
  <rect x="12" y="20" width="40" height="6" rx="3" fill="#f3ead6"/>
  <path d="M28.8 28 h6.4 l1.8 27 h-10 z" fill="url(#path)" mask="url(#ripples)"/>
</svg>
